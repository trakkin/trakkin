[package]
authors = ["Elias Benbourenane"]
autobins = false
edition = "2024"
homepage = "https://trakkin.dev"
license = "AGPL-3.0-only"
name = "trakkin"
publish = false
repository = "https://github.com/trakkin/trakkin"
rust-version = "1.97.1"
version = "0.0.0"

[[bin]]
name = "trakkin"
path = "src/main.rs"

[[bin]]
name = "export_openapi"
path = "src/bin/export_openapi.rs"

[features]
default = []
bundled = ["embedded-database", "dep:mime_guess", "dep:rust-embed"]
embedded-database = ["dep:postgresql_archive", "dep:postgresql_embedded"]

[package.metadata.sqruff]
dialect = "postgres"

[workspace]
resolver = "3"

[workspace.metadata.dylint]
libraries = [
  { git = "https://github.com/gvozdvmozgu/cargo-sqruff", rev = "221b68b1a2b02cf005098e5bc78dda64efd29ce0" },
]

[dependencies]
axum = "0.8.9"
chacha20poly1305 = "0.10.1"
futures-util = "0.3.31"
getrandom = "0.4.3"
hex = "0.4.3"
mime_guess = { version = "2.0.5", optional = true }
postgresql_archive = { version = "0.21.0", default-features = false, optional = true, features = [
  "tls-rustls-ring",
  "zonky",
] }
postgresql_embedded = { version = "0.21.0", default-features = false, optional = true, features = [
  "tls-rustls-ring",
  "tokio",
  "zonky",
] }
oci-client = { version = "0.17.0", default-features = false, features = [
  "rustls-tls",
] }
semver = { version = "1.0.28", features = ["serde"] }
sqlx = { version = "0.9.0", default-features = false, features = [
  "json",
  "macros",
  "migrate",
  "postgres",
  "runtime-tokio",
  "time",
  "uuid",
] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
rust-embed = { version = "8.12.0", optional = true, features = [
  "include-exclude",
] }
rolling-file = "0.2.0"
reqwest = { version = "0.13.4", default-features = false, features = [
  "rustls",
  "stream",
] }
thiserror = "2.0.18"
time = { version = "0.3.55", features = ["formatting"] }
trait-variant = "0.1.3"
tokio = { version = "1.52.4", features = [
  "fs",
  "io-util",
  "macros",
  "net",
  "process",
  "rt-multi-thread",
  "signal",
  "sync",
  "time",
] }
tokio-util = { version = "0.7.18", features = ["codec", "io"] }
tonic = "0.14.6"
tracing = "0.1.44"
tracing-appender = "0.2.4"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "json"] }
trakkin-mappings-corpus = { git = "https://github.com/trakkin/trakkin-mappings.git", rev = "250cdc4c1d4183a3c46f7a94bdb26d258233556a", default-features = false }
trakkin-mappings-language = { git = "https://github.com/trakkin/trakkin-mappings.git", rev = "250cdc4c1d4183a3c46f7a94bdb26d258233556a" }
trakkin-provider-sdk = { git = "https://github.com/trakkin/trakkin-contracts.git", rev = "da8d5c70bd361c52d6d1ae331f643f713f4177e1" }
utoipa = { version = "5.5.0", features = ["uuid"] }
url = "2.5.8"
uuid = { version = "1.24.0", features = ["serde"] }

[dev-dependencies]
http-body-util = "0.1.3"
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }

[build-dependencies]
postgresql_archive = { version = "0.21.0", default-features = false, features = [
  "blocking",
  "tls-rustls-ring",
  "zonky",
], optional = true }
