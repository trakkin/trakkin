[package]
autobins = false
edition = "2024"
name = "trakkin"
rust-version = "1.97.1"
version = "0.0.0"

[[bin]]
name = "trakkin"
path = "src/main.rs"

[[bin]]
name = "export_openapi"
path = "src/bin/export_openapi.rs"

[features]
default = []
bundled = ["embedded-database", "dep:mime_guess", "dep:rust-embed"]
embedded-database = ["dep:postgresql_archive", "dep:postgresql_embedded"]

[package.metadata.sqruff]
dialect = "postgres"

[workspace]
resolver = "3"

[workspace.metadata.dylint]
libraries = [
  { git = "https://github.com/gvozdvmozgu/cargo-sqruff", rev = "221b68b1a2b02cf005098e5bc78dda64efd29ce0" },
]

[dependencies]
axum = "0.8.9"
chacha20poly1305 = "0.10.1"
futures-util = "0.3.31"
getrandom = "0.4.3"
hex = "0.4.3"
mime_guess = { version = "2.0.5", optional = true }
postgresql_archive = { version = "0.21.0", default-features = false, optional = true, features = [
  "tls-rustls-ring",
  "zonky",
] }
postgresql_embedded = { version = "0.21.0", default-features = false, optional = true, features = [
  "tls-rustls-ring",
  "tokio",
  "zonky",
] }
sqlx = { version = "0.9.0", default-features = false, features = [
  "json",
  "macros",
  "migrate",
  "postgres",
  "runtime-tokio",
  "time",
  "uuid",
] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
tar = "0.4.44"
rust-embed = { version = "8.12.0", optional = true, features = [
  "include-exclude",
] }
thiserror = "2.0.18"
time = { version = "0.3.55", features = ["formatting"] }
tokio = { version = "1.52.4", features = [
  "fs",
  "io-util",
  "macros",
  "net",
  "process",
  "rt-multi-thread",
  "signal",
  "sync",
  "time",
] }
tonic = "0.14.6"
tough = { version = "0.24.0", features = ["http"] }
trakkin-mapping = { git = "https://github.com/trakkin/trakkin-contracts.git", rev = "90afcd32fea7a072e00737d57853ba4c1ee28724" }
trakkin-provider-release = { git = "https://github.com/trakkin/trakkin-contracts.git", rev = "90afcd32fea7a072e00737d57853ba4c1ee28724" }
trakkin-provider-sdk = { git = "https://github.com/trakkin/trakkin-contracts.git", rev = "90afcd32fea7a072e00737d57853ba4c1ee28724" }
utoipa = { version = "5.5.0", features = ["uuid"] }
url = "2.5.8"
uuid = { version = "1.24.0", features = ["serde"] }
zstd = "0.13.3"

[dev-dependencies]
http-body-util = "0.1.3"
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }
trakkin-mapping = { git = "https://github.com/trakkin/trakkin-contracts.git", rev = "90afcd32fea7a072e00737d57853ba4c1ee28724", features = ["fixtures"] }

[build-dependencies]
postgresql_archive = { version = "0.21.0", default-features = false, features = [
  "blocking",
  "tls-rustls-ring",
  "zonky",
], optional = true }
