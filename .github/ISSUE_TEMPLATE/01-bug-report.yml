name: Bug report
description: Report a reproducible problem in Trakkin
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Search existing issues before filing a report. Do not include secrets, access tokens, or private media data. Report security vulnerabilities through the private security link in the issue chooser.
  - type: dropdown
    id: affected-area
    attributes:
      label: Affected area
      description: Select every area involved in the problem.
      multiple: true
      options:
        - Backend
        - Frontend
        - Documentation
        - Provider
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Trakkin version
      description: Provide the release version or commit SHA where the problem occurs.
      placeholder: v0.1.0 or abc1234
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include the operating system, installation method, browser, and provider server versions when relevant.
      placeholder: |
        OS:
        Installation:
        Browser:
        Provider:
        Version:
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Provide the smallest sequence that reliably demonstrates the problem.
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected behavior
      description: Explain what should have happened and why.
    validations:
      required: true
  - type: textarea
    id: actual-behavior
    attributes:
      label: Actual behavior
      description: Explain what happened instead, including how often it occurs.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Paste relevant text after removing secrets and personal data. Prefer text over screenshots.
      render: shell
  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add screenshots, recordings, regressions, or other useful context.
  - type: checkboxes
    id: validations
    attributes:
      label: Validation
      options:
        - label: I searched existing open and closed issues for duplicates.
          required: true
        - label: I reproduced this with the latest release or current `main` branch.
          required: true
        - label: I removed secrets, tokens, and private media data from this report.
          required: true
