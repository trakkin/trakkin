[bootstrap.mise_shell_activate]
bashrc = "activate"

[settings]
lockfile = true
minimum_release_age = "3d"

[tools]
"npm:actions-up" = "1.18.0"
"cargo:cargo-dylint" = "6.0.3"
"cargo:cargo-edit" = { version = "0.13.13", default-features = false, features = "upgrade" }
"cargo:dylint-link" = "6.0.3"
"github:quarylabs/sqruff" = "0.40.0"
"github:kjanat/actionlint" = "1.13.0"
act = "0.2.89"
biome = "2.5.8"
cargo-binstall = "1.21.1"
node = "26.7.0"
pnpm = "11.21.0"
rg = "15.2.0"
rust = { version = "1.97.1", components = "rust-analyzer,rust-src,rustfmt,clippy" }
usage = "5.1.0"
watchexec = "2.7.0"

[tasks.build]
description = "Build the self-contained release executable"
run = [
  { task = "api:generate" },
  { task = "web:build" },
  { task = "server:build" },
  { task = "release:stage" },
]

[tasks."api:generate"]
description = "Generate the OpenAPI document and web API types"
run = [
  "mkdir -p target/openapi",
  "cargo run --locked --quiet --bin export_openapi -- target/openapi/trakkin.openapi.json",
  "pnpm --dir frontend exec openapi-typescript ../target/openapi/trakkin.openapi.json -o src/lib/api/generated/schema.ts",
]

[tasks."server:build"]
description = "Build the bundled release server"
run = "cargo build --locked --release --workspace --features trakkin/bundled"

[tasks."web:build"]
description = "Build the web application"
dir = "frontend"
run = "pnpm build"

[tasks."docs:build"]
description = "Build the documentation site"
dir = "docs"
run = "pnpm build"

[tasks."release:stage"]
description = "Stage the release executable for distribution"
hide = true
run = "install -D -m 755 target/release/trakkin dist/trakkin"

[tasks.clean]
description = "Clean server, web, documentation, and release artifacts"
run = [{ tasks = ["server:clean", "web:clean", "docs:clean", "release:clean"] }]

[tasks."server:clean"]
description = "Clean server build artifacts"
run = "cargo clean"

[tasks."web:clean"]
description = "Clean web build artifacts"
dir = "frontend"
run = "pnpm clean"

[tasks."docs:clean"]
description = "Clean documentation build artifacts"
dir = "docs"
run = "pnpm clean"

[tasks."release:clean"]
description = "Clean staged release artifacts"
run = "rm -rf dist"

[tasks.dev]
description = "Run the server and web development processes"
run = [{ tasks = ["server:dev", "web:dev"] }]

[tasks."server:dev"]
description = "Restart the server when Rust inputs change"
run = '''
watchexec --restart --stop-signal SIGTERM \
  --watch Cargo.toml \
  --watch Cargo.lock \
  --watch build.rs \
  --watch migrations \
  --watch src \
  --exts rs,toml,lock,sql \
  --shell=bash \
  -- 'cargo run --locked -p trakkin --features embedded-database --bin trakkin'
'''

[tasks."web:dev"]
description = "Run the web development server"
dir = "frontend"
run = "pnpm dev"

[tasks."docs:dev"]
description = "Run the documentation development server"
dir = "docs"
run = "pnpm dev"

[tasks.fix]
description = "Fix server, web, documentation, and SQL issues"
run = [
  { task = "server:fix" },
  { task = "web:fix" },
  { task = "docs:fix" },
  { task = "sql:fix" },
]

[tasks."server:fix"]
description = "Apply automated server lint fixes"
run = "cargo clippy --fix --workspace --all-targets --all-features --allow-dirty"

[tasks."web:fix"]
description = "Apply automated web lint fixes"
dir = "frontend"
run = "pnpm fix"

[tasks."sql:fix"]
description = "Apply automated SQL lint and formatting fixes"
run = [
  "cargo dylint --all --fix -- --workspace --all-targets --allow-dirty --ignore-rust-version",
  "sqruff fix --dialect postgres migrations",
]

[tasks."docs:fix"]
description = "Apply automated documentation lint fixes"
dir = "docs"
run = "pnpm fix"

[tasks.format]
description = "Format server, web, and documentation sources"
run = [
  { task = "server:format" },
  { task = "web:format" },
  { task = "docs:format" },
]

[tasks."server:format"]
description = "Format server sources"
run = "cargo fmt --all"

[tasks."web:format"]
description = "Format web sources"
dir = "frontend"
run = "pnpm format"

[tasks."docs:format"]
description = "Format documentation sources"
dir = "docs"
run = "pnpm format"

[tasks.setup]
description = "Set up server, web, and documentation dependencies"
run = [{ tasks = ["server:setup", "web:setup", "docs:setup"] }]

[tasks."server:setup"]
description = "Fetch locked server dependencies"
run = "cargo fetch --locked"

[tasks."web:setup"]
description = "Install web dependencies and Chromium"
dir = "frontend"
run = [
  "pnpm install",
  "pnpm exec playwright install-deps chromium",
  "pnpm setup",
]

[tasks."docs:setup"]
description = "Install and prepare documentation dependencies"
dir = "docs"
run = ["pnpm install", "pnpm setup"]

[tasks.check]
description = "Check workflows, server, web, documentation, and SQL sources"
run = [
  { tasks = [
    "workflows:check",
    "server:check",
    "web:check",
    "docs:check",
    "sql:check",
  ] },
]

[tasks."workflows:check"]
description = "Check GitHub Actions workflows"
run = "actionlint"

[tasks."server:check"]
description = "Check server lints"
run = "cargo clippy --workspace --all-targets --all-features -- -D warnings"

[tasks."web:check"]
description = "Check web formatting, lints, and types"
dir = "frontend"
run = "pnpm lint"

[tasks."sql:check"]
description = "Check embedded and migration SQL"
run = [
  "cargo dylint --all -- --workspace --all-targets --ignore-rust-version",
  "sqruff lint --dialect postgres migrations",
]

[tasks."docs:check"]
description = "Check documentation formatting and types"
dir = "docs"
run = "pnpm lint"

[tasks.test]
description = "Run server and web tests"
run = [{ task = "server:test" }, { task = "web:test" }]

[tasks."server:test"]
description = "Run server tests"
run = "cargo test --workspace --all-features"

[tasks."web:test"]
description = "Run web browser tests"
dir = "frontend"
run = "pnpm test"

[tasks.update]
description = "Update the toolchain, workflows, server, web, and documentation dependencies"
run = [
  { task = "toolchain:update" },
  { tasks = [
    "workflows:update",
    "server:update",
    "web:update",
    "docs:update",
  ] },
]

[tasks."workflows:update"]
description = "Update and SHA-pin GitHub Actions dependencies"
run = "actions-up --yes"

[tasks."server:update"]
description = "Update server dependencies"
run = "cargo upgrade --incompatible allow --pinned allow"

[tasks."web:update"]
description = "Update web dependencies"
dir = "frontend"
run = "pnpm update --latest"

[tasks."docs:update"]
description = "Update documentation dependencies"
dir = "docs"
run = "pnpm update --latest"

[tasks."toolchain:update"]
description = "Update mise-managed tools"
run = "mise upgrade --bump"
