[settings]
lockfile = true
minimum_release_age = "3d"

[tools]
"npm:actions-up" = "1.18.0"
"cargo:cargo-dylint" = "6.0.3"
"cargo:cargo-edit" = { version = "0.13.13", default-features = false, features = "upgrade" }
"cargo:dylint-link" = "6.0.3"
"github:quarylabs/sqruff" = "0.40.0"
"github:kjanat/actionlint" = "1.13.0"
act = "0.2.89"
biome = "2.5.8"
cargo-binstall = "1.21.1"
node = "26.7.0"
pnpm = "11.21.0"
rg = "15.2.0"
rust = { version = "1.97.1", components = "rust-analyzer,rust-src,rustfmt,clippy" }
usage = "5.1.0"
watchexec = "2.7.0"

[tasks.build]
description = "Build the self-contained release executable"
run = [
  { task = "clean:release" },
  { task = "build:frontend" },
  { task = "build:backend" },
  { task = "stage:release" },
]

[tasks."build:backend"]
run = "cargo build --locked --release --workspace --features trakkin/bundled"

[tasks."build:frontend"]
dir = "frontend"
run = "pnpm build"

[tasks."build:frontend:bundle"]
dir = "frontend"
run = "pnpm exec vite build"

[tasks."build:docs"]
dir = "docs"
run = "pnpm build"

[tasks."stage:release"]
run = "install -D -m 755 target/release/trakkin dist/trakkin"

[tasks."build:docker"]
run = '''
#!/usr/bin/env bash
mise run docker -- "$@"
'''

[tasks.clean]
description = "Clean all build artifacts"
run = [
  { tasks = [
    "clean:backend",
    "clean:frontend",
    "clean:docs",
    "clean:release",
  ] },
]

[tasks."clean:backend"]
run = "cargo clean"

[tasks."clean:frontend"]
dir = "frontend"
run = "pnpm clean"

[tasks."clean:docs"]
dir = "docs"
run = "pnpm clean"

[tasks."clean:release"]
run = "rm -rf dist"

[tasks.dev]
description = "Run backend and frontend development servers"
run = [{ tasks = ["dev:backend", "dev:frontend"] }]

[tasks."dev:backend"]
description = "Regenerate the HTTP client and restart the backend when Rust inputs change"
run = '''
watchexec --restart --stop-signal SIGTERM \
  --watch Cargo.toml \
  --watch Cargo.lock \
  --watch build.rs \
  --watch migrations \
  --watch src \
  --exts rs,toml,lock,sql \
  --shell=bash \
  -- 'pnpm --dir frontend generate:api && cargo run --locked -p trakkin --features embedded-database --bin trakkin'
'''

[tasks."dev:frontend"]
dir = "frontend"
run = "pnpm dev"

[tasks."dev:docs"]
dir = "docs"
run = "pnpm dev"

[tasks.start]
description = "Build and start the backend, frontend, and documentation servers"
run = [
  { tasks = [
    "build:frontend",
    "build:docs",
  ] },
  { tasks = [
    "start:backend",
    "start:frontend",
    "start:docs",
  ] },
]

[tasks."start:backend"]
run = "cargo run --locked -p trakkin --features embedded-database --bin trakkin"

[tasks."start:frontend"]
dir = "frontend"
run = "pnpm start"

[tasks."start:docs"]
dir = "docs"
run = "pnpm start"

[tasks.fix]
description = "Automatically fix lint and formatting issues"
run = [
  { task = "fix:backend" },
  { task = "fix:frontend" },
  { task = "fix:sql" },
]

[tasks."fix:backend"]
run = "cargo clippy --fix --workspace --all-targets --all-features --allow-dirty"

[tasks."fix:frontend"]
dir = "frontend"
run = "pnpm fix"

[tasks."fix:sql"]
run = [
  "cargo dylint --all --fix -- --workspace --all-targets --allow-dirty --ignore-rust-version",
  "sqruff fix --dialect postgres migrations",
]

[tasks."fix:docs"]
dir = "docs"
run = "pnpm fix"

[tasks.format]
description = "Format the project"
run = [
  { task = "format:backend" },
  { task = "format:frontend" },
  { task = "format:sql" },
]

[tasks."format:backend"]
run = "cargo fmt --all"

[tasks."format:frontend"]
dir = "frontend"
run = "pnpm format"

[tasks."format:sql"]
run = [
  "cargo dylint --all --fix -- --workspace --all-targets --allow-dirty --ignore-rust-version",
  "sqruff fix --dialect postgres migrations",
]

[tasks."format:docs"]
dir = "docs"
run = "pnpm format"

[tasks.setup]
description = "Set up product dependencies"
run = [{ tasks = ["setup:backend", "setup:frontend"] }, { task = "prepare" }]

[tasks."setup:backend"]
run = "cargo fetch --locked"

[tasks."setup:frontend"]
dir = "frontend"
run = "pnpm install"

[tasks."setup:docs"]
dir = "docs"
run = "pnpm install"

[tasks.lint]
description = "Lint the project"
run = [
  { tasks = [
    "lint:actions",
    "lint:backend",
    "lint:frontend",
    "lint:sql",
  ] },
]
[tasks."lint:actions"]
run = "actionlint"

[tasks."lint:backend"]
run = "cargo clippy --workspace --all-targets --all-features -- -D warnings"

[tasks."lint:frontend"]
dir = "frontend"
run = "pnpm lint"

[tasks."lint:sql"]
run = [
  "cargo dylint --all -- --workspace --all-targets --ignore-rust-version",
  "sqruff lint --dialect postgres migrations",
]

[tasks."lint:docs"]
dir = "docs"
run = "pnpm lint"

[tasks.prepare]
description = "Prepare frontend browser dependencies"
run = [{ task = "prepare:frontend" }]

[tasks."prepare:frontend"]
dir = "frontend"
run = ["pnpm exec playwright install-deps chromium", "pnpm setup"]

[tasks."prepare:docs"]
dir = "docs"
run = "pnpm setup"

[tasks.test]
description = "Run all tests"
run = [{ task = "test:backend" }, { task = "test:frontend" }]

[tasks."test:backend"]
run = "cargo test --workspace --all-features"

[tasks."test:frontend"]
dir = "frontend"
run = "pnpm test"

[tasks.update]
description = "Update tools and dependencies"
run = [
  { task = "update:tools" },
  { tasks = [
    "update:actions",
    "update:backend",
    "update:frontend",
    "update:docs",
  ] },
]

[tasks."update:actions"]
description = "Update and SHA-pin GitHub Actions dependencies"
run = "actions-up --yes"

[tasks."update:backend"]
run = "cargo upgrade --incompatible allow --pinned allow"

[tasks."update:frontend"]
dir = "frontend"
run = "pnpm update --latest"

[tasks."update:docs"]
dir = "docs"
run = "pnpm update --latest"

[tasks."update:tools"]
run = "mise upgrade --bump"
