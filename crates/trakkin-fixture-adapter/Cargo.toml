[package]
edition = "2024"
name = "trakkin-fixture-adapter"
rust-version = "1.97.1"
version = "0.0.0"

[features]
host-embedded-tests = ["trakkin/embedded-database"]

[[test]]
name = "connection_acquisition_repository"
required-features = ["host-embedded-tests"]

[dependencies]
prost-types = "0.14.4"
sha2 = "0.10.9"
thiserror = "2.0.18"
tokio = { version = "1.52.4", features = [
  "io-util",
  "macros",
  "process",
  "rt-multi-thread",
  "sync",
  "time",
] }
tokio-stream = "0.1.18"
tokio-util = { version = "0.7.18", features = ["rt"] }
tonic = "0.14.6"
trakkin-adapter-contract = { path = "../trakkin-adapter-contract" }
trakkin-adapter-sdk = { path = "../trakkin-adapter-sdk" }

[dev-dependencies]
serde_json = "1.0.150"
sqlx = { version = "0.9.0", default-features = false, features = [
  "postgres",
  "runtime-tokio",
] }
tempfile = "3.27.0"
time = "0.3.55"
trakkin = { path = "../.." }
trakkin-mapping-contract = { path = "../trakkin-mapping-contract" }
uuid = "1.24.0"
